<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tasks</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tasks">
<meta name="theme-color" content="#2f6bff">
<style>
:root{--bg:#f6f6f7;--card:#fff;--ink:#111;--mute:#8b8b92;--line:#e7e7ea;--blue:#2f6bff;--red:#d64545;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0b0b0c;--card:#151517;--ink:#f3f3f5;--mute:#797981;--line:#242427;--blue:#4d8bff}}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
body{font:15px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 120px}
header{position:sticky;top:0;z-index:5;margin:0 -16px;padding:max(env(safe-area-inset-top),14px) 16px 12px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{font-size:22px;font-weight:700;letter-spacing:-.025em}
.btn{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:8px 15px;font:inherit;font-weight:600;cursor:pointer}
.chart{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;text-align:center;font-size:11px;line-height:1.25;color:var(--mute)}
.chart>div{cursor:pointer}.mk{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:var(--card);color:var(--blue);display:grid;place-items:center}.mk.no{color:var(--mute)}.mk:empty{display:none}
.track{height:50px;margin:0 0 5px;border-radius:9px;background:var(--line);position:relative;overflow:hidden}
.fill{position:absolute;inset:auto 0 0;height:0;background:var(--mute);transition:height .9s cubic-bezier(.2,.8,.2,1)}
.t{color:var(--ink)}.t .fill{background:var(--blue)}.sel span{color:var(--blue);font-weight:600}.nx .track{background:none;border:1.5px dashed var(--line)}.nx.sel .track{border-color:var(--blue)}.pre .chk{display:none}
h2{font-size:13px;font-weight:600;color:var(--mute);margin:26px 2px 6px}
.list{background:var(--card);border-radius:16px;overflow:hidden}
.task{display:flex;gap:13px;align-items:flex-start;padding:13px 15px;cursor:pointer;border-top:1px solid var(--line);position:relative}
.task:first-child{border-top:0}
.chk{flex:none;width:23px;height:23px;margin-top:1px;border-radius:50%;border:1.8px solid var(--mute);background:none;color:transparent;font-size:13px;display:grid;place-items:center;padding:0;cursor:pointer;transition:.2s}
.done .chk{background:var(--blue);border-color:var(--blue);color:#fff}
.done .nm{text-decoration:line-through;color:var(--mute)}
.body{flex:1;min-width:0}.nm{font-weight:560}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-top:2px;font-size:12.5px;color:var(--mute)}
.dots{display:inline-flex;gap:2px}.dots i{width:5px;height:5px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--ink)}
.note{margin-top:3px;font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.over{color:var(--red);font-weight:600}
.last{background:color-mix(in srgb,var(--blue) 10%,var(--card))}
.last::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--blue);animation:glow 1.8s ease-in-out infinite}
.last .when{color:var(--blue);font-weight:700}
@keyframes glow{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.last::before{animation:none}.fill{transition:none}}
details summary{cursor:pointer;color:var(--mute);font-size:13px;font-weight:600;margin:26px 2px 6px}
.empty{padding:34px 20px;text-align:center;color:var(--mute)}
#err{color:var(--red);font-size:12.5px;margin-top:8px}
.fab{display:none}
@media(max-width:640px){.add{display:none}.fab{display:grid;place-items:center;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(26px + env(safe-area-inset-bottom));z-index:2147483647;width:58px;height:58px;border:0;border-radius:50%;background:var(--blue);color:#fff;font-size:32px;font-weight:300;box-shadow:0 8px 24px color-mix(in srgb,var(--blue) 45%,transparent)}}
dialog{border:0;border-radius:20px;background:var(--card);color:var(--ink);width:min(480px,94vw);padding:20px;margin:auto;max-height:92vh}
dialog::backdrop{background:#0007;backdrop-filter:blur(3px)}
dialog[open]{animation:up .25s ease-out}@keyframes up{from{transform:translateY(24px);opacity:0}}
@media(max-width:640px){dialog{width:100%;max-width:none;margin:auto 0 0;border-radius:22px 22px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom))}}
label{display:block;margin:14px 0 5px;font-size:12.5px;color:var(--mute)}
input,textarea{width:100%;font:inherit;font-size:16px;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:0}
input:focus,textarea:focus{border-color:var(--blue)}
#n{font-size:19px;font-weight:600;border:0;background:none;padding:4px 0}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:9px 0;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.seg .on{background:var(--blue);border-color:var(--blue);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chips button{border:0;background:var(--bg);color:var(--blue);border-radius:99px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer}
.acts{display:flex;gap:10px;margin-top:20px}.acts .btn{flex:1;padding:12px}
.acts .del{flex:none;background:none;color:var(--red);padding:12px 8px}
.wk button{border-radius:99px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.grid button{aspect-ratio:1;padding:0;border:1px solid var(--line);background:var(--bg);color:inherit;border-radius:50%;font:inherit;font-size:13px;cursor:pointer}.grid .on{background:var(--blue);border-color:var(--blue);color:#fff}dialog h3{font-size:19px;letter-spacing:-.02em}.sum{color:var(--mute);font-size:13px;margin:4px 0 6px}.hrow{display:flex;gap:13px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}.ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#fff;margin-top:1px}.ic.y{background:var(--blue)}.ic.n{background:none;border:1.6px solid var(--mute);color:var(--mute)}
#cg{display:flex;flex-wrap:wrap;gap:6px}.pill{border:1px solid var(--line);background:var(--bg);color:inherit;border-radius:99px;padding:6px 13px;font:inherit;font-size:14px;cursor:pointer}.pill.on{background:var(--blue);border-color:var(--blue);color:#fff}.pill.add{color:var(--blue);border-style:dashed}.pill-in{width:150px;border-radius:99px;padding:6px 13px}
#tabs{position:sticky;top:var(--hh,0px);z-index:4;display:flex;align-items:center;gap:4px;margin:0 -16px;padding:0 12px 0 16px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.tl{position:relative;flex:1;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}.tl::-webkit-scrollbar{display:none}
.tl button{flex:none;background:none;border:0;color:var(--mute);font:inherit;font-size:14px;font-weight:560;padding:12px 10px;cursor:pointer;white-space:nowrap;transition:color .2s}
.tl button.on{color:var(--ink)}.tl i{font-style:normal;font-size:11px;font-weight:650;margin-left:5px;opacity:.7}.tl .on i{color:var(--blue);opacity:1}
.ind{position:absolute;left:0;bottom:0;height:2px;width:0;border-radius:2px;background:var(--blue);transition:transform .38s cubic-bezier(.2,.8,.2,1),width .38s cubic-bezier(.2,.8,.2,1)}
.vb{flex:none;width:34px;height:34px;display:grid;place-items:center;border:0;border-radius:10px;background:none;color:var(--mute);cursor:pointer;transition:.15s}.vb:hover,.vb.open{background:var(--line);color:var(--ink)}
.vm{position:absolute;top:calc(100% + 6px);right:12px;width:236px;padding:6px;border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:0 14px 40px #0003;transform-origin:top right;animation:pop .16s ease-out}@keyframes pop{from{opacity:0;transform:scale(.95)}}
.vm button{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border:0;border-radius:9px;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}.vm button:hover{background:var(--bg)}
.vm svg{flex:none;color:var(--mute)}.vm b{display:block;font-size:14px;font-weight:560}.vm small{display:block;color:var(--mute);font-size:12px}
.vm .tick{margin-left:auto;color:var(--blue);opacity:0}.vm .on .tick{opacity:1}
#main>h2:first-child{margin-top:16px}h2 em{font-style:normal;font-weight:650;margin-left:7px;color:var(--blue)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top"><h1>Tasks</h1><button class="btn add" data-new>+ New</button></div>
    <div class="chart" id="chart"></div>
    <div id="err"></div>
  </header>
  <nav id="tabs" hidden>
    <div class="tl" id="tl"><span class="ind" id="ind"></span></div>
    <button class="vb" id="vb" aria-label="View options"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h12M6.5 10h7M9 14h2"/></svg></button>
    <div class="vm" id="vm" hidden>
      <button data-g="mix"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h14M3 10h14M3 15h14"/></svg><span><b>Mixed</b><small>Everything by priority</small></span><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="tick"><path d="M4 10.5l4 4 8-9"/></svg></button>
      <button data-g="grp"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h7M3 7h7M12 4h5M12 7h5M3 13h14M3 16h14"/></svg><span><b>Grouped</b><small>Split up by category</small></span><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="tick"><path d="M4 10.5l4 4 8-9"/></svg></button>
    </div>
  </nav>
  <main id="main"></main>
</div>
<button class="fab" data-new aria-label="New task">+</button>

<dialog id="dlg">
  <form id="f" autocomplete="off">
    <input id="n" placeholder="What needs to be done?" required>
    <label>Category</label><div id="cg"></div>
    <div class="two">
      <div><label>Starts</label><input type="date" id="st"></div>
      <div><label>Deadline</label><input type="date" id="dl"></div>
    </div>
    <div class="chips"><button type="button" data-t>Today</button><button type="button" data-d="7">+1 week</button><button type="button" data-d="14">+2 weeks</button><button type="button" data-d="30">+1 month</button><button type="button" data-d="">No deadline</button></div>
    <label>Importance</label>
    <div class="seg" id="imp"><button type="button" data-i="1">1</button><button type="button" data-i="2">2</button><button type="button" data-i="3">3</button><button type="button" data-i="4">4</button><button type="button" data-i="5">5</button></div>
    <div id="rw">
      <label>Repeat</label>
      <div class="seg" id="rep"><button type="button" data-r="none">Never</button><button type="button" data-r="daily">Daily</button><button type="button" data-r="weekly">Weekly</button><button type="button" data-r="monthly">Monthly</button></div>
      <div id="wkw" hidden><label>Every</label><div class="seg wk" id="wk"><button type="button" data-w="1">Mo</button><button type="button" data-w="2">Tu</button><button type="button" data-w="3">We</button><button type="button" data-w="4">Th</button><button type="button" data-w="5">Fr</button><button type="button" data-w="6">Sa</button><button type="button" data-w="0">Su</button></div></div>
      <div id="mdw" hidden><label>On day of the month</label><div class="grid" id="mdg"></div></div>
      <div id="spw" hidden><label>Days to finish each repeat</label><input type="number" id="sp" min="0" inputmode="numeric"></div>
    </div>
    <label>Notes</label><textarea id="nt" rows="3"></textarea>
    <div class="acts"><button type="button" class="btn del" id="del" hidden>Delete</button><button class="btn">Save</button></div>
  </form>
</dialog>
<dialog id="day"><h3 id="dayT"></h3><div id="dayB"></div><button class="btn" id="dx" style="width:100%;margin-top:18px;padding:12px">Close</button></dialog>

<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const P=s=>{const[a,b,c]=s.split('-');return new Date(a,b-1,c)};
const add=(s,n)=>{const d=P(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((P(b)-P(a))/864e5);
const today=()=>iso(new Date(Date.now()-108e5)); // the day ends at 03:00
const dm=s=>`${s.slice(8)}.${s.slice(5,7)}.`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
const isT=x=>x.repeat!=='none'&&!x.series;
const dots=n=>`<span class=dots>${[1,2,3,4,5].map(i=>`<i${i<=n?' class=on':''}></i>`).join('')}</span>`;
function firstOn(s,r,n){if(r==='daily')return s;for(let i=0;i<400;i++){const d=add(s,i);if(r==='weekly'?P(d).getDay()===n:+d.slice(8)===n)return d}return s}
let DAYS=[],wd=1,md=1,view=0,cat='',adding=false,fcat=localStorage.f||'*',mode=localStorage.g||'mix';
const ic=d=>`<svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
const CK=ic('M3.5 8.5l3 3 6-7'),X=ic('M4.5 4.5l7 7M11.5 4.5l-7 7');
let T=JSON.parse(localStorage.t||'[]'),key=localStorage.k||'',cur=null,imp=3,rep='none';

async function api(m='GET',b,q='',again){
  const r=await fetch('/api'+q,{method:m,headers:{'x-key':key,'content-type':'application/json'},body:b&&JSON.stringify(b)});
  if(r.status===401){const j=await r.json();if(again||j.error!=='Wrong password')throw Error(j.error);
    key=prompt('Password')||'';if(!key)throw Error('Password needed');localStorage.k=key;return api(m,b,q,1)}
  const j=await r.json();if(!r.ok)throw Error(j.error);return j;
}
const err=e=>$('#err').textContent=e?e.message:'';
async function load(){try{T=await api();localStorage.t=JSON.stringify(T);err()}catch(e){err(e)}draw()}

function draw(){
  const t=today(),inst=T.filter(x=>!isT(x));
  // completion chart: a task counts on its deadline day (undated tasks on the day they are finished)
  const S=[...Array(8)].map((_,i)=>{const d=add(t,i-6),items=[];let n=0,k=0;
    inst.forEach(x=>{if((x.deadline||x.completed)!==d)return;const ok=!!x.completed&&(!x.deadline||x.completed<=x.deadline);n+=x.importance;if(ok)k+=x.importance;items.push({x,ok})});
    return{d,items,n,p:n?Math.round(100*k/n):0,full:n>0&&k===n,early:inst.filter(x=>x.completed===d&&x.deadline>d)}});
  DAYS=S;
  const ch=$('#chart');
  if(!ch.children.length)ch.innerHTML=S.map((_,i)=>`<div data-day=${i}${i==6?' class=t':i==7?' class=nx':''}><div class=track><div class=fill></div><em class=mk></em></div><span></span></div>`).join('');
  setTimeout(()=>[...ch.children].forEach((c,i)=>{const s=S[i],m=c.querySelector('.mk');
    c.querySelector('.fill').style.height=s.p+'%';
    m.innerHTML=i<6&&s.n?(s.full?CK:X):'';m.className='mk'+(s.full?'':' no');c.classList.toggle('sel',i==6+view);
    c.querySelector('span').textContent=i==6?'Today':P(s.d).toLocaleDateString('en',{weekday:'short'})}),60);

  // priority: importance, pushed up as the deadline gets closer
  const ref=view?add(t,1):t;
  const left=x=>x.deadline?diff(ref,x.deadline):99;
  const pr=x=>x.importance*2+(x.deadline?Math.max(0,10-Math.max(left(x),0)):0);
  const sort=a=>a.sort((a,b)=>pr(b)-pr(a)||left(a)-left(b));
  const open=inst.filter(x=>!x.completed);
  const live=x=>!x.deadline||x.deadline>=ref;
  const nowAll=sort(open.filter(x=>(!x.start||x.start<=ref)&&live(x)));
  const cats=[...new Set(T.map(x=>x.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  if(fcat!=='*'&&(!cats.length||!(fcat==='__other'?nowAll.some(x=>!x.category):cats.includes(fcat))))fcat='*';
  const inCat=x=>fcat==='*'||(fcat==='__other'?!x.category:x.category===fcat);
  const now=nowAll.filter(inCat),soon=open.filter(x=>x.start>ref&&live(x)&&inCat(x)).sort((a,b)=>a.start<b.start?-1:1);
  const grouped=mode==='grp'&&fcat==='*'&&cats.length>0,hc=grouped||fcat!=='*';
  const done=view?[]:inst.filter(x=>x.completed===t&&inCat(x)),rules=T.filter(x=>isT(x)&&inCat(x));

  const tabs=[['*','All',nowAll.length],...cats.map(c=>[c,c,nowAll.filter(x=>x.category===c).length])];
  if(cats.length&&nowAll.some(x=>!x.category))tabs.push(['__other','Other',nowAll.filter(x=>!x.category).length]);
  $('#tabs').hidden=!cats.length;
  const tl=$('#tl');tl.querySelectorAll('button').forEach(b=>b.remove());
  $('#ind').insertAdjacentHTML('afterend',tabs.map(([k,l,n])=>`<button data-f="${esc(k)}"${k===fcat?' class=on':''}>${esc(l)}<i>${n}</i></button>`).join(''));
  document.querySelectorAll('#vm [data-g]').forEach(b=>b.classList.toggle('on',b.dataset.g===mode));
  document.documentElement.style.setProperty('--hh',document.querySelector('header').offsetHeight+'px');
  requestAnimationFrame(()=>{const a=tl.querySelector('.on');if(!a)return;$('#ind').style.width=a.offsetWidth+'px';$('#ind').style.transform=`translateX(${a.offsetLeft}px)`;tl.scrollTo({left:a.offsetLeft-(tl.clientWidth-a.offsetWidth)/2,behavior:'smooth'})});
  const row=(x,tpl)=>{
    const d=x.deadline?diff(t,x.deadline):null,span=x.deadline?diff(x.start||x.created,x.deadline):0;
    const last=!tpl&&!x.completed&&x.deadline===ref&&span>=3;
    let when=tpl?{daily:'Every day',weekly:'Every week',monthly:'Every month'}[x.repeat]+(x.span?`, ${x.span} days to finish`:''):
      x.start>ref?'Starts '+dm(x.start):d===null?'':
      d===0?(last?'Last day':'Due today'):d===1?(last?'Last day':'Due tomorrow'):d<0?`Due ${dm(x.deadline)}`:`Due ${dm(x.deadline)} (${d} days)`;
    return`<div class="task${x.completed?' done':''}${last?' last':''}" data-id="${x.id}">`+
      (tpl?'':`<button class=chk aria-label="Done">${CK}</button>`)+
      `<div class=body><div class=nm>${esc(x.name)}</div><div class=meta>${when?`<span class=when>${when}</span>`:''}`+
      (x.category&&!hc?`<span>${esc(x.category)}</span>`:'')+
      `${dots(x.importance)}</div>`+
      (x.notes?`<div class=note>${esc(x.notes)}</div>`:'')+`</div></div>`;
  };
  const grp=()=>[...new Set(now.map(x=>x.category))].sort((a,b)=>!a?1:!b?-1:a.localeCompare(b)).map(k=>{const g=now.filter(x=>x.category===k);return`<h2>${esc(k||'Other')}<em>${g.length}</em></h2><div class=list>${g.map(x=>row(x)).join('')}</div>`}).join('');
  const sec=(h,a,tpl)=>a.length?`<h2>${h}</h2><div class=list>${a.map(x=>row(x,tpl)).join('')}</div>`:'';
  $('#main').className=view?'pre':'';$('h1').textContent=view?'Tomorrow':'Tasks';
  $('#main').innerHTML=(now.length?(grouped?grp():`<div class=list style="margin-top:8px">${now.map(x=>row(x)).join('')}</div>`):
    `<div class="list empty" style="margin-top:8px">${fcat!=='*'?'Nothing in this category.':T.length?'All clear for now.':'No tasks yet. Add your first one.'}</div>`)+
    sec('Coming up',soon)+sec('Done today',done)+
    (rules.length?`<details><summary>Repeating (${rules.length})</summary><div class=list>${rules.map(x=>row(x,1)).join('')}</div></details>`:'');
}

async function toggle(id){
  const x=T.find(a=>a.id===id);x.completed=x.completed?null:today();draw();localStorage.t=JSON.stringify(T);
  try{await api('PATCH',{id,completed:x.completed})}catch(e){err(e)}
}
const setImp=n=>{imp=n;document.querySelectorAll('#imp button').forEach(b=>b.classList.toggle('on',+b.dataset.i===n))};
const setRep=r=>{rep=r;document.querySelectorAll('#rep button').forEach(b=>b.classList.toggle('on',b.dataset.r===r));$('#spw').hidden=r==='none';$('#wkw').hidden=r!=='weekly';$('#mdw').hidden=r!=='monthly'};
const setWd=n=>{wd=n;document.querySelectorAll('#wk button').forEach(b=>b.classList.toggle('on',+b.dataset.w===n))};
const setMd=n=>{md=n;document.querySelectorAll('#mdg button').forEach(b=>b.classList.toggle('on',+b.dataset.m===n))};
$('#mdg').innerHTML=[...Array(31)].map((_,i)=>`<button type=button data-m=${i+1}>${i+1}</button>`).join('');
function openForm(x){
  cur=x||null;
  $('#n').value=x?.name||'';cat=x?(x.category||''):(fcat!=='*'&&fcat!=='__other'?fcat:'');adding=false;renderCats();const sd=view?add(today(),1):today();$('#st').value=x?(x.start||''):sd;$('#dl').value=x?(x.deadline||''):sd;
  $('#sp').value=x?.span??14;$('#nt').value=x?.notes||'';setImp(x?.importance||3);setRep(x?.repeat||'none');
  if(x&&isT(x)&&x.start){setWd(P(x.start).getDay());setMd(+x.start.slice(8))}else{setWd(1);setMd(1)}
  $('#rw').hidden=!!x?.series;$('#del').hidden=!x;$('#dlg').showModal();
}
document.addEventListener('click',e=>{
  const g=s=>e.target.closest(s),vm=$('#vm');
  if(g('#vb')){vm.hidden=!vm.hidden;return $('#vb').classList.toggle('open',!vm.hidden)}
  if(!vm.hidden&&!g('#vm')){vm.hidden=true;$('#vb').classList.remove('open')}
  if(g('[data-g]')){mode=g('[data-g]').dataset.g;localStorage.g=mode;vm.hidden=true;$('#vb').classList.remove('open');return draw()}
  if(g('[data-f]')){fcat=g('[data-f]').dataset.f;localStorage.f=fcat;return draw()}
  if(g('[data-new]'))return openForm();
  if(g('[data-i]'))return setImp(+g('[data-i]').dataset.i);
  if(g('[data-r]')){const r=g('[data-r]').dataset.r;setRep(r);return $('#sp').value={none:0,daily:0,weekly:6,monthly:14}[r]}
  if(g('[data-d]')){const v=g('[data-d]').dataset.d;return $('#dl').value=v?add($('#st').value||today(),+v):''}
  if(g('[data-t]'))return $('#dl').value=today();
  if(g('[data-cat]')){const c=g('[data-cat]').dataset.cat;cat=cat===c?'':c;return renderCats()}
  if(g('[data-newcat]')){adding=true;return renderCats()}
  if(g('[data-w]'))return setWd(+g('[data-w]').dataset.w);
  if(g('[data-m]'))return setMd(+g('[data-m]').dataset.m);
  if(g('[data-day]')){const i=+g('[data-day]').dataset.day;if(i<6)return showDay(i);view=i-6;return draw()}
  if(e.target===$('#day'))return $('#day').close();
  if(e.target===$('#dlg'))return $('#dlg').close();
  const row=g('.task');if(!row)return;
  if(g('.chk'))toggle(row.dataset.id);else openForm(T.find(a=>a.id===row.dataset.id));
});
$('#f').onsubmit=async e=>{
  e.preventDefault();
  const o={name:$('#n').value.trim(),category:cat,importance:imp,start:rep==='none'?($('#st').value||null):firstOn($('#st').value||today(),rep,rep==='weekly'?wd:md),deadline:$('#dl').value||null,notes:$('#nt').value,repeat:rep,span:+$('#sp').value||0};
  $('#dlg').close();
  try{
    if(cur){Object.assign(cur,o);draw();await api('PATCH',{id:cur.id,...o})}
    else{T.push(await api('POST',o));draw()}
    if(rep!=='none')await load();
  }catch(x){err(x)}
};
$('#del').onclick=()=>{if(!confirm('Delete this task?'))return;const id=cur.id;T=T.filter(a=>a.id!==id);$('#dlg').close();draw();api('DELETE',null,'?id='+id).catch(err)};
function renderCats(){
  const all=[...new Set([...T.map(x=>x.category),cat].filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  $('#cg').innerHTML=all.map(c=>`<button type=button class="pill${c===cat?' on':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')+(adding?'<input id=cn class=pill-in placeholder="New category" maxlength=30>':'<button type=button class="pill add" data-newcat>+ New</button>');
  if(adding)$('#cn').focus();
}
function commitCat(){if(!adding)return;adding=false;const v=($('#cn')?.value||'').trim().replace(/,/g,' ');if(v)cat=v;renderCats()}
document.addEventListener('keydown',e=>{if(e.target.id==='cn'&&e.key==='Enter'){e.preventDefault();commitCat()}});
document.addEventListener('focusout',e=>{if(e.target.id==='cn')commitCat()});
function showDay(i){
  const s=DAYS[i],r=(x,ok)=>`<div class=hrow><span class="ic ${ok?'y':'n'}">${ok?CK:X}</span><div class=body><div class=nm>${esc(x.name)}</div><div class=meta>${x.completed&&!ok?`<span>Done ${dm(x.completed)}</span>`:''}${x.category?`<span>${esc(x.category)}</span>`:''}${dots(x.importance)}</div></div></div>`;
  $('#dayT').textContent=P(s.d).toLocaleDateString('en',{weekday:'long',day:'numeric',month:'long'});
  $('#dayB').innerHTML=(s.items.length?`<p class=sum>${s.items.filter(a=>a.ok).length} of ${s.items.length} done</p>`+s.items.map(a=>r(a.x,a.ok)).join(''):'<p class=sum>Nothing was due.</p>')+(s.early.length?'<h2>Also finished</h2>'+s.early.map(x=>r(x,1)).join(''):'');
  $('#day').showModal();
}
$('#dx').onclick=()=>$('#day').close();
addEventListener('resize',()=>document.documentElement.style.setProperty('--hh',document.querySelector('header').offsetHeight+'px'));
document.addEventListener('visibilitychange',()=>!document.hidden&&load());
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');
draw();load();
</script>
</body>
</html>
